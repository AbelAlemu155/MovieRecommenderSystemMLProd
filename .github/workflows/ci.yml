name: CI

on:
  pull_request:
    branches: [ "dockerize" ]
  push:
    branches: [ "dockerize" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r homealone/requirements.txt
          pip install -r homealone/data_processing/requirements.txt
          pip install -r homealone/inference/requirements.txt
          pip install -r homealone/monitoring/requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=homealone --cov-report=term-missing homealone/tests --cov-fail-under=70
      
