services:
  training:
    build:
      context: homealone/training
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    restart: on-failure

  inference:
    build:
      context: homealone/inference
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    ports:
      - "8082:8082"
    depends_on:
      - training
    restart: on-failure

  kafka_processor:
    build:
      context: homealone/data_processing
      dockerfile: Dockerfile
    command: python /app/data_processing/process.py
    environment:
      - TUNNEL_USER=${TUNNEL_USER}
      - TUNNEL_IP=${TUNNEL_IP}
      - TUNNEL_PASSWORD=${TUNNEL_PASSWORD}
      - TUNNEL_PORT=${TUNNEL_PORT}
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/data_processing/data_queues:/app/data_queues
    restart: on-failure

  db_writer:
    build:
      context: homealone/data_processing
      dockerfile: Dockerfile
    command: python /app/data_processing/db_writer.py
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/data_processing/data_queues:/app/data_queues
    restart: on-failure
    depends_on:
      kafka_processor:
        condition: service_started

  monitoring:
    build:
      context: homealone/monitoring
      dockerfile: Dockerfile
    environment:
      - TEST_MODE=false
      - TUNNEL_USER=${TUNNEL_USER}
      - TUNNEL_IP=${TUNNEL_IP}
      - TUNNEL_PASSWORD=${TUNNEL_PASSWORD}
      - TUNNEL_PORT=${TUNNEL_PORT}
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/reports:/app/reports
    ports:
      - "8000:8000"
    restart: on-failure
    depends_on:
      - db_writer
      - inference

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: on-failure
    depends_on:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./homealone/grafana/provisioning:/etc/grafana/provisioning
    restart: on-failure
    depends_on:
      - prometheus

volumes:
  grafana-data:
  prometheus-data:
