services:
  training:
    build:
      context: homealone/training
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    restart: on-failure

  inference:
    build:
      context: homealone/inference
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    ports: 
      - "8082:8082"
    depends_on:
      - training
    restart: on-failure

  kafka_processor:
    build:
      context: homealone/data_processing
      dockerfile: Dockerfile
    command: python /app/data_processing/process.py
    environment:
      - TUNNEL_USER=${TUNNEL_USER}
      - TUNNEL_IP=${TUNNEL_IP}
      - TUNNEL_PASSWORD=${TUNNEL_PASSWORD}
      - TUNNEL_PORT=${TUNNEL_PORT}
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/data_processing/data_queues:/app/data_queues
    restart: on-failure

  db_writer:
    build:
      context: homealone/data_processing
      dockerfile: Dockerfile
    command: python /app/data_processing/db_writer.py
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/data_processing/data_queues:/app/data_queues
    restart: on-failure
    depends_on:
      kafka_processor:
        condition: service_started

  drift_monitor:
    build:
      context: homealone/monitoring
      dockerfile: Dockerfile
    command: python /app/monitoring/data_drift_monitor.py
    environment:
      - TEST_MODE=false
    volumes:
      - ./homealone/db:/app/db
      - ./homealone/reports:/app/reports
    restart: on-failure
    depends_on:
      - db_writer
