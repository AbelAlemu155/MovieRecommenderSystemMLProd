services:
  training:
    build:
      context: homealone/training
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    restart: on-failure

  db:
    build:
      context: homealone/db
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    ports:
      - "5000:5000"
    restart: on-failure

  inference:
    build:
      context: homealone/inference
      dockerfile: Dockerfile
    volumes:
      - ./homealone/models:/app/models
      - ./homealone/db:/app/db
    ports: 
      - "8080:8080"
    depends_on:
      - training
    restart: on-failure

volumes:
  model_storage:
    driver: local
  db_data:
    driver: local
