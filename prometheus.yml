global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'monitoring'
    static_configs:
      - targets: ['monitoring:8000']
        labels:
          service: 'recommendation-monitoring'

  - job_name: 'model-quality'
    static_configs:
      - targets: ['model-quality:8001']
        labels:
          service: 'model-quality-monitoring'
