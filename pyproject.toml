[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-alone"        
version = "0.1.0"
description = "Movie recommender"
authors = [
  { name = "Mustapha Alaba", email = "alabamustapha@gmail.com" },
  { name = "Stephen Oduh", email = "osobotu@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "kafka-python",
  "pandas",
  "pyarrow",
  "dotenv",
  "requests"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
